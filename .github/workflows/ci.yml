name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Match the box: uv-managed CPython bundles SQLite 3.53; Ubuntu's system 3.45 rejects
      # memo.leads' correlated ORDER BY.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen pytest -q
