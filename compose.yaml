# SSRD on the local box. Both services share ./data (private, gitignored).
x-hardening: &hardening
  build: { context: ., dockerfile: docker/Dockerfile }
  image: ssrd:local
  read_only: true
  tmpfs: ["/tmp:noexec,nosuid,size=64m", "/run/ssrd:noexec,nosuid,size=1m"]
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]  # used only by the entrypoint; dropped before ssrd starts
  security_opt: ["no-new-privileges:true"]
  dns: [1.1.1.1, 8.8.8.8]
  networks: [ssrd]
  volumes: ["./data:/app/data"]
  environment:
    SSRD_COMMIT: ${SSRD_COMMIT:-unknown}
    SSRD_UID: ${SSRD_UID:-1000}   # matches the host owner of ./data; nothing else is mounted
    SSRD_GID: ${SSRD_GID:-1000}
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
  restart: unless-stopped
  mem_limit: 1g
  cpus: 2
  pids_limit: 256
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  ingest:
    <<: *hardening
    command: ["ingest"]
  fetcher:
    <<: *hardening
    command: ["fetcher"]
    depends_on: [ingest]
    profiles: ["fetch"]          # not started by default; `docker compose --profile fetch up -d`
  check:
    <<: *hardening
    command: ["safety-check"]
    restart: "no"
    profiles: ["check"]

networks:
  ssrd:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
